# 版本号单一来源 / single source of truth for the app version.
#
# 三处读它：app/build.gradle.kts（写进 APK）、scripts/publish-apk.mjs（生成
# apk/version.json）、应用内更新的比对逻辑。改这里一处即可，别在别处硬编码，
# 否则 version.json 里的 versionCode 会和实际 APK 对不上，用户会收到一个
# 「永远提示有新版、装完还是旧版」的循环。
#
# Read by three places: build.gradle.kts (baked into the APK),
# scripts/publish-apk.mjs (generates apk/version.json) and the in-app updater.
# Bump only here; a mismatch yields an endless "update available" loop.
versionCode=1
versionName=1.0.0
