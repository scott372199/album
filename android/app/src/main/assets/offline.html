<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>网络不可用</title>
<!--
  断网时的兜底页。由 WebViewClient.onReceivedError 加载，不从网络取任何资源——
  依赖任何外部请求都会和「断网」这件事本身自相矛盾。

  重试走原生桥 `AlbumNative.reloadSite()`：站点地址只在 BuildConfig 里有一份，
  不在这份 HTML 里硬编码，换域名时不用改两个地方。

  Offline fallback loaded by onReceivedError. It fetches nothing from the
  network on purpose. Retry goes through the native bridge so the site origin
  stays defined in exactly one place (BuildConfig).
-->
<style>
  :root {
    --paper: #fff;
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --accent: #0071e3;
    --line: rgba(0, 0, 0, 0.1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: calc(32px + env(safe-area-inset-top, 0px)) 28px
             calc(32px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .mark {
    width: 56px;
    height: 56px;
    border: 1.5px solid var(--line);
    border-radius: 16px;
    display: grid;
    place-items: center;
  }
  .mark span {
    display: block;
    width: 26px;
    height: 1.5px;
    background: var(--ink-2);
    box-shadow: 0 8px 0 var(--ink-2), 0 -8px 0 var(--ink-2);
  }
  h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  p {
    margin: 0;
    max-width: 22em;
    text-align: center;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink-2);
  }
  button {
    margin-top: 6px;
    height: 40px;
    padding: 0 22px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: #f2f2f4; }
  button[hidden] { display: none; }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true"><span></span></div>
  <h1>网络不可用</h1>
  <p>照片在你的服务器上，需要联网才能打开。检查一下网络或稍后再试。</p>
  <button id="retry" type="button">重新加载</button>

  <script>
    // 原生桥只在 App 里存在；用纯 HTML 打开时按钮没有意义，直接隐藏。
    var bridge = window.AlbumNative;
    var button = document.getElementById('retry');
    if (bridge && typeof bridge.reloadSite === 'function') {
      button.addEventListener('click', function () {
        button.disabled = true;
        button.textContent = '正在重试…';
        bridge.reloadSite();
        // 重试失败会再次进到本页；按钮卡在禁用态就永远点不动了，所以兜回来。
        setTimeout(function () {
          button.disabled = false;
          button.textContent = '重新加载';
        }, 4000);
      });
    } else {
      button.hidden = true;
    }
  </script>
</body>
</html>
