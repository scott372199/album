# Gradle 本体 / Gradle itself
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# 站点地址，构建期注入 BuildConfig.SITE_URL。不带末尾斜杠。
# 调试 CloudFront 默认域名时改这一行即可，不用动代码。
# Injected into BuildConfig at build time; no trailing slash. Point this at the
# CloudFront domain when the custom domain is not reachable.
album.siteUrl=https://photos.chenyouyi.top
