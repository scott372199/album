<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上传与确认 · 我们的孩子</title>
<style>
  :root{
    --bg:#FFFFFF; --surf:#FAF8F4; --surf2:#F4F1EA;
    --ink:#111111; --mute:#767676; --rule:#E8E8E8; --rule2:#DED8CD;
    --accent:#B4795A; --ok:#3B6D11; --warn:#854F0B;
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC",SimSun,serif;
    --sans:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
  }
  html{font-size:15px;}
  html.lg{font-size:18px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.7;
    -webkit-font-smoothing:antialiased;padding-bottom:70px;}
  img{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}

  .hd{height:44px;border-bottom:1px solid var(--rule);display:flex;align-items:center;padding:0 28px;
    position:sticky;top:0;background:#fff;z-index:60;}
  .hd .b{font-weight:700;font-size:.9375rem;letter-spacing:.02em;}
  .hd .tag{font-size:.6875rem;letter-spacing:.14em;color:var(--accent);border:1px solid var(--accent);
    padding:1px 6px;margin-left:10px;}
  .hd .r{margin-left:auto;display:flex;gap:20px;font-size:.8125rem;color:var(--mute);}
  .hd .r a:hover{color:var(--ink);}

  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}

  /* 步骤 */
  .steps{display:flex;align-items:center;gap:0;margin:26px 0 22px;font-size:.8125rem;}
  .steps .st{display:flex;align-items:center;gap:9px;color:#9A958C;}
  .steps .st.now{color:var(--ink);}
  .steps .n{width:20px;height:20px;border:1px solid var(--rule2);display:grid;place-items:center;
    font-size:.6875rem;font-family:var(--mono);color:inherit;}
  .steps .st.done .n{background:var(--ok);border-color:var(--ok);color:#fff;}
  .steps .st.now .n{background:var(--ink);border-color:var(--ink);color:#fff;}
  .steps .line{width:46px;height:1px;background:var(--rule2);margin:0 14px;}

  /* 摘要 */
  .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
    border:1px solid var(--rule);margin-bottom:26px;}
  .sum div{background:#fff;padding:16px 18px;}
  .sum .k{font-size:.6875rem;letter-spacing:.14em;color:var(--mute);margin-bottom:6px;}
  .sum .v{font-family:var(--serif);font-size:1.5rem;font-weight:300;line-height:1.2;}
  .sum .v small{font-family:var(--sans);font-size:.75rem;color:var(--mute);margin-left:4px;}

  /* 工具条 */
  .tools{display:flex;align-items:center;gap:12px;padding:12px 0 16px;border-bottom:1px solid var(--rule);
    flex-wrap:wrap;}
  .tabs{display:flex;gap:4px;}
  .tab{font-size:.8125rem;padding:5px 12px;color:var(--mute);border:1px solid transparent;}
  .tab.on{border-color:var(--rule2);color:var(--ink);background:var(--surf);}
  .tools .sp{margin-left:auto;}
  .btn{font-size:.8125rem;padding:7px 14px;border:1px solid var(--rule2);letter-spacing:.02em;
    transition:.18s;}
  .btn:hover{border-color:var(--ink);}
  .btn.solid{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.solid:hover{background:#000;}
  .btn.sm{padding:4px 10px;font-size:.75rem;}
  .btn.mg{color:var(--warn);border-color:#DDA84C;}
  .src{font-size:.6875rem;color:#9A958C;font-family:var(--mono);letter-spacing:.02em;}

  /* 草稿行 */
  .list{margin-top:6px;}
  .row{display:grid;grid-template-columns:88px 1fr 168px;gap:22px;padding:22px 0;
    border-bottom:1px solid var(--rule);position:relative;transition:opacity .3s;}
  .row .cov{position:relative;}
  .row .cov img{width:88px;height:112px;object-fit:cover;filter:sepia(.1) saturate(.94);}
  .row .cov .cnt{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;
    font-size:.625rem;font-family:var(--mono);text-align:center;padding:2px 0;}
  .row .body{min-width:0;}
  .row .ailabel{font-size:.6875rem;letter-spacing:.1em;color:var(--mute);margin-bottom:7px;}
  .row .tchips{display:flex;gap:7px;flex-wrap:wrap;}
  .row .tchip{font-family:var(--serif);font-size:1rem;padding:4px 12px;border:1px solid var(--rule2);
    color:#5A5650;transition:.16s;}
  .row .tchip:hover{border-color:#B9B2A5;color:var(--ink);}
  .row .tchip.on{border-color:var(--ink);color:var(--ink);background:var(--surf);}
  .row .meta{font-size:.75rem;color:var(--mute);margin-top:10px;font-family:var(--mono);}
  .row .who{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .row .pill{font-size:.6875rem;padding:2px 8px;background:var(--surf2);color:#5A5650;}
  .row .pill.sc{background:#EEF0EA;color:#4C5C43;}
  .row .right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;}
  .conf{font-size:.6875rem;letter-spacing:.08em;display:flex;align-items:center;gap:6px;color:var(--mute);}
  .conf .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}
  .conf.mid .dot{background:#BA7517;}
  .conf.low .dot{background:#B4453C;}
  .acts{display:flex;gap:6px;}
  .warnbox{grid-column:2/4;margin-top:12px;font-size:.75rem;color:var(--warn);background:#FDF7EC;
    border-left:2px solid #DDA84C;padding:7px 12px;}

  .row.done{opacity:.42;}
  .row.done .acts{pointer-events:none;}
  .row.done::after{content:"已确认";position:absolute;right:0;top:22px;font-size:.6875rem;color:var(--ok);
    letter-spacing:.1em;}
  .row.done .conf{opacity:0;}
  .row.hide{display:none;}

  .empty{display:none;padding:60px 0;text-align:center;color:#9A958C;font-size:.875rem;}

  /* 底部条 */
  .publish-auth{position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:90;display:grid;place-items:center;padding:20px;}
  .publish-auth[hidden]{display:none;}
  .publish-auth .box{background:#fff;max-width:360px;width:100%;padding:24px;box-shadow:0 16px 40px rgba(0,0,0,.18);}
  .publish-auth h3{font-family:var(--serif);font-weight:400;margin-bottom:14px;}
  .publish-auth input{width:100%;border:0;border-bottom:1px solid var(--rule2);padding:9px 0;margin:6px 0 12px;font:inherit;}
  .publish-auth .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
  .barfix .cnt{font-size:.8125rem;color:var(--mute);font-family:var(--mono);}
  .barfix .cnt b{color:var(--ink);font-weight:400;}
  .barfix .tip{font-size:.75rem;color:#9A958C;margin-left:18px;}
  .barfix .go{margin-left:auto;}

  @media (max-width:900px){
    .sum{grid-template-columns:1fr 1fr;}
    .row{grid-template-columns:76px 1fr;gap:16px;}
    .row .right{grid-column:2;flex-direction:row;align-items:center;margin-top:12px;}
    .row .cov img{width:76px;height:96px;}
    .warnbox{grid-column:2;}
  }
</style>
</head>
<body>

<header class="hd">
  <span class="b">我们的孩子</span><span class="tag">上传与管理</span>
  <div class="r">
    <a href="demo-首页.html">返回首页</a>
    <button id="btnBig" type="button" aria-label="切换长辈模式">字</button>
    <a href="#">帮助</a>
  </div>
</header>

<div class="wrap">

  <div class="steps">
    <div class="st done"><span class="n">1</span>上传 <span id="picked-count">0</span> 个新文件</div>
    <span class="line"></span>
    <div class="st done"><span class="n">2</span>自动识别</div>
    <span class="line"></span>
    <div class="st now"><span class="n">3</span>确认草稿</div>
    <button class="btn sm" id="pick-files" type="button">选择照片 / 视频</button>
    <input id="file-picker" type="file" accept="image/*,video/*" multiple hidden>
  </div>

  <div class="sum">
    <div><div class="k">照片</div><div class="v"><span id="n-photo">286</span><small>张</small></div></div>
    <div><div class="k">视频</div><div class="v"><span id="n-video">8</span><small>段 · 已抽帧</small></div></div>
    <div><div class="k">已认出的人</div><div class="v"><span id="n-people">6</span><small>位家人</small></div></div>
    <div><div class="k">生成草稿</div><div class="v"><span id="n-story">18</span><small>个故事集</small></div></div>
  </div>

  <div class="tools">
    <div class="tabs">
      <button class="tab on" data-t="all">全部 18</button>
      <button class="tab" data-t="todo">待确认 15</button>
      <button class="tab" data-t="done">已确认 3</button>
    </div>
    <div class="sp"></div>
    <span class="src" id="src">正在读取…</span>
    <button class="btn sm" id="bulk">一键接受 14 个高置信度</button>
  </div>

  <div class="list" id="list"></div>

  <div class="empty" id="empty">这个分类下没有草稿了。</div>

</div>

<div class="publish-auth" id="publish-auth" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="publish-auth-title">
    <h3 id="publish-auth-title">发布到 V7</h3>
    <input id="publish-phone" type="tel" inputmode="numeric" placeholder="手机号" autocomplete="tel">
    <input id="publish-key" type="password" placeholder="共享密钥" autocomplete="off">
    <div class="actions">
      <button class="btn sm" id="publish-cancel" type="button">取消</button>
      <button class="btn sm solid" id="publish-confirm" type="button">开始发布</button>
    </div>
  </div>
</div>

<div class="barfix">
  <div class="cnt">已确认 <b id="okn">0</b> / <b id="tot">0</b></div>
  <div class="tip">高置信度的可以直接接受，剩下的才需要你看一眼</div>
  <div class="go"><button class="btn solid" id="finish" type="button" onclick="document.getElementById('publish-auth').hidden=false">完成并发布到相册</button></div>
</div>

<script>
(function(){
  // App 内这个域名会被 MainActivity 拦到本地 Room 接口；浏览器里请求失败，自动退回下面的演示数据
  var API = 'https://appassets.androidplatform.net/api';
  var DEMO = { total: 6, highConfidence: 3, items: [
    { id:'st_walk', title:'走路这件事', candidates:['走路这件事','学会走路的那几个月','2021 年的春天'], aiNote:'AI 建议标题 · 三个候选，选一个或自己改',
      range:'2021.03.14 — 2021.11.02', confidence:'high', people:['妈妈','外婆'], scenes:['家里','小区'],
      photoCount:23, videoCount:1, cover:'https://picsum.photos/seed/rv01/300/380' },
    { id:'st_plaza', title:'楼下的小广场', candidates:['楼下的小广场','每天下午的那个广场','2021—2022 的下午'], aiNote:'AI 建议标题 · 检测到跨年重复场景，建议设为「系列」',
      range:'2021.04.05 — 2022.10.21', confidence:'high', people:['外婆'], scenes:['公园','系列'],
      photoCount:41, videoCount:0, cover:'https://picsum.photos/seed/rv02/300/380' },
    { id:'st_newyear', title:'过年回老家', candidates:['过年回老家','2021 年春节','回爷爷奶奶家'], aiNote:'AI 建议标题 · 三张候选都不太满意，可以直接写',
      range:'2021.02.11 — 2021.02.16', confidence:'mid', people:['爷爷','奶奶'], scenes:['节日'],
      photoCount:34, videoCount:0, cover:'https://picsum.photos/seed/rv03/300/380' },
    { id:'st_er', title:'2021 年 7 月照片', candidates:['2021 年 7 月照片','未命名合集','一组照片'], aiNote:'AI 拿不准 · 场景和人物都识别到了，但说不出这是什么事',
      range:'2021.07.22 — 2021.07.24', confidence:'low', people:['爸爸','妈妈'], scenes:['医院'],
      photoCount:9, videoCount:0, cover:'https://picsum.photos/seed/rv04/300/380' },
    { id:'st_plane', title:'第一次坐飞机', candidates:['第一次坐飞机','2021 年国庆的三天','带他出门'], aiNote:'AI 建议标题 · 含视频，已抽帧 12 张',
      range:'2021.10.03 — 2021.10.05', confidence:'high', people:['爸爸','妈妈'], scenes:['旅行'],
      photoCount:21, videoCount:2, cover:'https://picsum.photos/seed/rv05/300/380' },
    { id:'st_bath', title:'洗澡时的照片', candidates:['洗澡这件事（续）','洗澡时的照片','2022 年夏天'], aiNote:'AI 建议标题 · 与已有的「洗澡这件事」可能重复，稍后可合并',
      range:'2022.06.08 — 2022.08.30', confidence:'mid', people:['爸爸'], scenes:['家里','系列'],
      photoCount:26, videoCount:0, cover:'https://picsum.photos/seed/rv06/300/380' }
  ]};

  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var okn = document.getElementById('okn');
  var tot = document.getElementById('tot');
  var src = document.getElementById('src');
  var bulkBtn = document.getElementById('bulk');
  var tabs = document.querySelectorAll('.tab');
  var state = { total:0, high:0, live:false, tab:'all', items:[], pickedFiles:[] };

  function esc(t){
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function label(conf){
    if (conf === 'low') return 'AI 拿不准 · 场景和人物都识别到了，但说不出这是什么事';
    if (conf === 'mid') return 'AI 建议标题 · 三张候选都不太满意，可以直接写';
    return 'AI 建议标题 · 三个候选，选一个或自己改';
  }

  function confText(conf){
    if (conf === 'low') return '需要你命名';
    if (conf === 'mid') return '置信度中';
    return '置信度高';
  }

  function rowHtml(s){
    var cands = (s.candidates || []).map(function(t, i){
      return '<button class="tchip' + (i === 0 ? ' on' : '') + '">' + esc(t) + '</button>';
    }).join('');
    var who = (s.people || []).map(function(p){
      return '<span class="pill">' + esc(p) + '</span>';
    }).join('') + (s.scenes || []).map(function(p){
      return '<span class="pill sc">' + esc(p) + '</span>';
    }).join('');
    var cnt = s.photoCount + ' 张' + (s.videoCount ? ' · ' + s.videoCount + ' 段视频' : '');
    var warn = s.confidence === 'low'
      ? '<div class="warnbox">AI 判断不出这是一件什么事，只留了时间和地点。给它起个名字就好，或者先跳过，以后再来。</div>'
      : '';
    return '<div class="row' + (s.status === 'published' ? ' done' : '') + '" data-conf="' + esc(s.confidence) + '" data-id="' + esc(s.id) + '">' +
      '<div class="cov"><img src="' + esc(s.cover) + '" alt=""><div class="cnt">' + cnt + '</div></div>' +
      '<div class="body">' +
        '<div class="ailabel">' + esc(s.aiNote || label(s.confidence)) + '</div>' +
        '<div class="tchips">' + cands + '</div>' +
        '<div class="who">' + who + '</div>' +
        '<div class="meta">' + esc(s.range) + '</div>' +
      '</div>' +
      '<div class="right">' +
        '<span class="conf ' + esc(s.confidence) + '"><span class="dot"></span>' + confText(s.confidence) + '</span>' +
        '<div class="acts"><button class="btn sm ok">接受</button><button class="btn sm rn">改名</button>' +
        ((s.aiNote || '').indexOf('可能重复') > -1 ? '<button class="btn sm mg">合并</button>' : '') + '</div>' +
      '</div>' + warn +
    '</div>';
  }

  function countDone(){
    return document.querySelectorAll('.row.done').length;
  }

  function remainHigh(){
    var n = 0;
    list.querySelectorAll('.row[data-conf="high"]').forEach(function(r){
      if (!r.classList.contains('done')) n++;
    });
    return n;
  }

  function refreshCounts(){
    var done = countDone();
    okn.textContent = done;
    tot.textContent = state.total;
    tabs.forEach(function(t){
      if (t.dataset.t === 'all') t.textContent = '全部 ' + state.total;
      if (t.dataset.t === 'todo') t.textContent = '待确认 ' + (state.total - done);
      if (t.dataset.t === 'done') t.textContent = '已确认 ' + done;
    });
    if (bulkBtn) {
      var left = remainHigh();
      if (!bulkBtn.dataset.locked) {
        bulkBtn.textContent = left ? '一键接受 ' + left + ' 个高置信度' : '没有待接受的高置信度';
        bulkBtn.disabled = left === 0;
        bulkBtn.style.opacity = left === 0 ? .55 : 1;
      }
    }
  }

  function bindRow(row){
    row.querySelectorAll('.tchip').forEach(function(c){
      c.addEventListener('click', function(){
        row.querySelectorAll('.tchip').forEach(function(x){ x.classList.remove('on'); });
        c.classList.add('on');
      });
    });
    var ok = row.querySelector('.ok');
    if (ok) ok.addEventListener('click', function(){
      if (row.classList.contains('done')) return;
      accept(row.dataset.id, function(){
        row.classList.add('done');
        refreshCounts();
        applyTab();
      });
    });
    var rn = row.querySelector('.rn');
    if (rn) rn.addEventListener('click', function(){
      var cur = row.querySelector('.tchip.on');
      var next = window.prompt('给这个故事起个名字', cur ? cur.textContent : '');
      if (!next || !next.trim()) return;
      next = next.trim();
      var chip = document.createElement('button');
      chip.className = 'tchip on';
      chip.textContent = next;
      chip.addEventListener('click', function(){
        row.querySelectorAll('.tchip').forEach(function(x){ x.classList.remove('on'); });
        chip.classList.add('on');
      });
      row.querySelectorAll('.tchip').forEach(function(x){ x.classList.remove('on'); });
      row.querySelector('.tchips').insertBefore(chip, row.querySelector('.tchip'));
      rename(row.dataset.id, next);
    });
    var mg = row.querySelector('.mg');
    if (mg) mg.addEventListener('click', function(){
      var choices = state.items.filter(function(s){ return s.id !== row.dataset.id && s.status !== 'merged'; });
      if (!choices.length) return;
      var answer = window.prompt('输入要并入的故事标题：\\n' + choices.map(function(s){ return s.title; }).join(' / '), choices[0].title);
      if (!answer) return;
      var target = choices.find(function(s){ return s.title === answer.trim() || s.id === answer.trim(); });
      if (!target) { window.alert('没有找到这个故事'); return; }
      merge(row.dataset.id, target.id, function(){
        state.total = Math.max(0, state.total - 1);
        row.classList.add('hide', 'merged');
        refreshCounts();
        applyTab();
      });
    });
  }

  function accept(id, done){
    if (!state.live) { done(); return; }
    fetch(API + '/drafts/' + encodeURIComponent(id) + '/accept', { method:'POST' })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(){ done(); })
      .catch(function(){ done(); });
  }

  function rename(id, title){
    if (!state.live) return;
    fetch(API + '/drafts/' + encodeURIComponent(id) + '/rename?title=' + encodeURIComponent(title),
          { method:'POST' }).catch(function(){});
  }

  function merge(id, into, done){
    if (!state.live) { window.alert('演示数据不能合并，请在 App 内操作'); return; }
    fetch(API + '/drafts/' + encodeURIComponent(id) + '/merge?into=' + encodeURIComponent(into),
          { method:'POST' })
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(){ done(); })
      .catch(function(){ window.alert('合并失败，请稍后重试'); });
  }

  function fillStats(st){
    if (!st) return;
    var set = function(id, v){ var el = document.getElementById(id); if (el && v != null) el.textContent = v; };
    set('n-photo', st.photos);
    set('n-video', st.videos);
    set('n-people', st.people);
    set('n-story', st.batchStories);
  }

  function render(payload){
    state.total = payload.total || (payload.items || []).length;
    state.high = payload.highConfidence || 0;
    var items = payload.items || [];
    state.items = items;
    list.innerHTML = items.map(rowHtml).join('');
    list.querySelectorAll('.row').forEach(bindRow);
    refreshCounts();
    applyTab();
  }

  function applyTab(){
    var shown = 0;
    list.querySelectorAll('.row').forEach(function(r){
      var done = r.classList.contains('done');
      var show = state.tab === 'all' || (state.tab === 'done' && done) || (state.tab === 'todo' && !done);
      r.classList.toggle('hide', !show);
      if (show) shown++;
    });
    empty.style.display = shown ? 'none' : 'block';
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      state.tab = t.dataset.t;
      applyTab();
    });
  });

  if (bulkBtn) bulkBtn.addEventListener('click', function(){
    var btn = this;
    var finish = function(n){
      list.querySelectorAll('.row[data-conf="high"]').forEach(function(r){ r.classList.add('done'); });
      btn.dataset.locked = '1';
      refreshCounts();
      btn.textContent = '已接受 ' + (n || 0) + ' 个高置信度';
      btn.disabled = true;
      btn.style.opacity = .55;
      applyTab();
    };
    if (!state.live) { finish(remainHigh()); return; }
    fetch(API + '/drafts/accept-all', { method:'POST' })
      .then(function(r){ return r.json(); })
      .then(function(j){ finish(j.accepted); })
      .catch(function(){ finish(remainHigh()); });
  });

  async function publishImage(file){
    var bitmap = await createImageBitmap(file);
    var scale = Math.min(1, 2048 / Math.max(bitmap.width, bitmap.height));
    var canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();
    return new Promise(function(resolve, reject){
      canvas.toBlob(function(blob){ blob ? resolve(blob) : reject(new Error('image encode failed')); }, 'image/jpeg', .86);
    });
  }
  async function publishSelected(phone, key){
    if (location.hostname !== 'appassets.androidplatform.net' || !state.pickedFiles.length) return false;
    var images = state.pickedFiles.filter(function(file){ return /^image\//.test(file.type); });
    var videos = state.pickedFiles.filter(function(file){ return /^video\//.test(file.type); });
    if (!images.length) { window.alert('本轮没有可发布的照片；视频发布将在视频展示图处理接入后开放。'); return false; }
    if (videos.length) window.alert('本轮先发布照片，视频已保留在本机，视频发布将在展示图处理接入后开放。');
    if (!phone || !key) return false;
    var base = 'https://3y07fqxete.execute-api.ap-southeast-1.amazonaws.com';
    var auth = await fetch(base + '/auth', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({phone:phone,key:key}) });
    if (!auth.ok) throw new Error('登录失败');
    var authJson = await auth.json();
    var prepared = [];
    for (var i=0; i<images.length; i++) {
      var blob = await publishImage(images[i]);
      var buffer = await blob.arrayBuffer();
      var digest = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', buffer))).map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');
      prepared.push({ name:'import-' + i + '.jpg', blob:blob, buffer:buffer, sha256:digest });
    }
    var signed = await fetch(base + '/v7/publish-url', { method:'POST', headers:{'content-type':'application/json', authorization:'Bearer ' + authJson.token}, body:JSON.stringify({files:prepared.map(function(x){ return {name:x.name,size:x.buffer.byteLength,sha256:x.sha256}; })}) });
    if (!signed.ok) throw new Error('无法取得发布地址');
    var items = (await signed.json()).items || [];
    if (items.some(function(x){ return x.multipart; })) throw new Error('存在过大的照片，请稍后使用分片发布');
    for (var j=0; j<items.length; j++) {
      var put = await fetch(items[j].url, { method:'PUT', headers:items[j].headers, body:prepared[j].buffer });
      if (!put.ok) throw new Error('照片发布失败');
    }
    return true;
  }

  var authBox = document.getElementById('publish-auth');
  var finish = document.getElementById('finish');
  function closePublishAuth(){ authBox.hidden = true; }
  document.getElementById('publish-cancel').addEventListener('click', closePublishAuth);
  document.getElementById('publish-confirm').addEventListener('click', async function(){
    var phone = document.getElementById('publish-phone').value.trim();
    var key = document.getElementById('publish-key').value;
    if (!phone || !key) return;
    this.disabled = true;
    this.textContent = '发布中…';
    try {
      var published = await publishSelected(phone, key);
      if (published) {
        closePublishAuth();
        finish.textContent = '已发布到 V7';
        finish.style.background = '#3B6D11';
        finish.style.borderColor = '#3B6D11';
      }
    } catch (e) {
      window.alert(e.message || '发布失败');
    } finally {
      this.disabled = false;
      this.textContent = '开始发布';
    }
  });
  finish.addEventListener('click', function(){
    if (location.hostname !== 'appassets.androidplatform.net') {
      this.textContent = '已发布 · 去相册看看';
      return;
    }
    if (!state.pickedFiles.length) {
      window.alert('请先选择照片');
      return;
    }
    authBox.hidden = false;
    document.getElementById('publish-phone').focus();
  });

  var picker = document.getElementById('file-picker');
  document.getElementById('pick-files').addEventListener('click', function(){ picker.click(); });
  picker.addEventListener('change', function(){
    var beforePhotos = Number(document.getElementById('n-photo').textContent || 0);
    var beforeVideos = Number(document.getElementById('n-video').textContent || 0);
    state.pickedFiles = state.pickedFiles.concat(Array.prototype.slice.call(picker.files));
    document.getElementById('picked-count').textContent = state.pickedFiles.length;
    if (picker.files.length) {
      src.textContent = '正在导入 ' + picker.files.length + ' 个文件到本机…';
      watchImport(0, beforePhotos, beforeVideos);
    }
  });

  // 先读本地数据库（bootstrap 出摘要，drafts 出列表）；不是 App 环境时退回演示数据
  var get = function(p){
    return fetch(API + p).then(function(r){
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  };

  function refreshLocal(){
    return Promise.all([get('/bootstrap'), get('/drafts')]).then(function(res){
      state.live = true;
      fillStats(res[0].stats);
      src.textContent = '本地数据库 · ' + res[1].total + ' 个草稿';
      render(res[1]);
      return res[0].stats;
    });
  }
  function watchImport(attempt, beforePhotos, beforeVideos){
    refreshLocal().then(function(stats){
      var photoChanged = Number(stats.photos || 0) > beforePhotos;
      var videoChanged = Number(stats.videos || 0) > beforeVideos;
      if (photoChanged || videoChanged || attempt >= 20) {
        if (Number(stats.photos || 0) > beforePhotos) {
          src.textContent = '导入完成 · 本地数据库已更新';
        } else {
          src.textContent = '导入仍在后台处理，请稍后刷新';
        }
        picker.value = '';
        return;
      }
      window.setTimeout(function(){ watchImport(attempt + 1, beforePhotos, beforeVideos); }, 400);
    }).catch(function(){
      if (attempt < 20) window.setTimeout(function(){ watchImport(attempt + 1, beforePhotos, beforeVideos); }, 400);
      else src.textContent = '导入状态暂时无法读取，请稍后刷新';
    });
  }

  refreshLocal()
    .catch(function(){
      src.textContent = '演示数据 · 6 条样例（App 内读本地数据库）';
      render(DEMO);
    });
})();
  document.getElementById('btnBig').addEventListener('click', function(){
    document.documentElement.classList.toggle('lg');
    try { localStorage.setItem('kids-large-type', document.documentElement.classList.contains('lg') ? '1' : '0'); } catch (e) {}
  });
  try { if (localStorage.getItem('kids-large-type') === '1') document.documentElement.classList.add('lg'); } catch (e) {}
</script>
