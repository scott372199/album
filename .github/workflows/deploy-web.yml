name: deploy-web

# 只发布「代码」，不发布「内容」。
#
# v4 之后照片由处理函数写进站点桶，所以这里**绝不能**对桶根做 sync：
# build:web 的产物里没有 photos/，根级 --delete 会把线上照片全部删掉。
# 按前缀分域是这条流水线的核心约束：
#
#   assets/      可 --delete（文件名带内容哈希，删旧的无副作用）
#   index.html   单独 cp，不缓存
#   photos/      不碰（处理函数写入）
#   data/        不碰（version.json 与清单由处理函数写入）
#
# Publishing code only, never content. Photos are written by the processor, so
# this workflow must never sync the bucket root: build:web has no photos/ dir and
# a root-level `--delete` would wipe every photo online. Prefix-scoped by design.

on:
  push:
    branches: [main]
    paths:
      - 'src/web/**'
      - 'src/build/**'
      - 'src/server/**'
      - 'site.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  # 发布不能并行：两个 run 同时 sync assets/ 会互相删对方的产物
  # Never run two deploys at once: concurrent asset syncs delete each other
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  SITE_BUCKET: ${{ vars.SITE_BUCKET }}
  DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖 / Install dependencies
        run: npm ci --no-audit --no-fund

      # --target=web：完全不读 photos/，CI 里也没有素材
      # ALBUM_API_BASE 留空时，产物里不含接口地址，上传入口也就不会出现
      - name: 构建前端 / Build web bundle
        env:
          ALBUM_API_BASE: ${{ vars.ALBUM_API_BASE }}
        run: npm run build:web

      # 断言跑在构建之后：它校验的是 dist/ 的产物，没有产物就没有可校验的东西
      # Assertions run after the build: they inspect dist/, which needs to exist
      - name: 结构断言 / Structure assertions
        run: npm run verify

      - name: 单测 / Unit tests
        run: npm test

      - name: 确认是「只发代码」的产物 / Assert web-only output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html 缺失，构建没跑成功"; exit 1; }
          test -d dist/assets   || { echo "::error::dist/assets 缺失，构建没跑成功"; exit 1; }
          # 产物里出现照片文件说明跑的是全量构建（--target=all），拒绝发布。
          # 只判「目录非空」而不是「目录存在」：web 目标本来就不建这个目录，
          # 万一某个工具留了个空目录，也不该因此挡住发布。
          # A non-empty photos/ means a full build (--target=all) was run: refuse.
          # We check for files, not the directory itself — an empty leftover dir
          # is harmless and must not block a legitimate deploy.
          if [ -n "$(ls -A dist/photos 2>/dev/null || true)" ]; then
            echo "::error::dist/photos 里有文件，说明跑的是全量构建，拒绝发布"
            ls -A dist/photos | head -20
            exit 1
          fi
          echo "产物：index.html + assets/（$(ls dist/assets | wc -l | tr -d ' ') 项），无照片目录"

      # 配置缺失要在这一步就说清楚。否则后面 aws 命令会报一个
      # 「s3:///assets/ 不是合法路径」之类的错，看日志的人得猜半天。
      # Surface missing configuration here instead of letting the aws commands
      # fail with a cryptic message about an empty bucket URL.
      - name: 检查仓库配置 / Check repository configuration
        env:
          ALBUM_API_BASE: ${{ vars.ALBUM_API_BASE }}
          ROLE_ARN: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN || secrets.AWS_APP_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SITE_BUCKET}" ] || missing+=("SITE_BUCKET")
          [ -n "${DISTRIBUTION_ID}" ] || missing+=("DISTRIBUTION_ID")
          [ -n "${ROLE_ARN}" ] || missing+=("AWS_APP_DEPLOY_ROLE_ARN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少配置：${missing[*]}（Settings → Secrets and variables → Actions；前两个在 Variables，角色 ARN 两处都认）"
            exit 1
          fi
          if [ -z "${ALBUM_API_BASE}" ]; then
            echo "::warning::ALBUM_API_BASE 未设置，产物不含接口地址，上传入口不会出现"
          fi

      - name: 配置 AWS 凭证 / Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Variables 或 Secrets 都认，理由同 build-image.yml
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN || secrets.AWS_APP_DEPLOY_ROLE_ARN }}
          role-session-name: gha-album-web
          aws-region: ${{ env.AWS_REGION }}

      # 第一段：assets/ 整目录，长缓存 + 允许删除。
      # 产物文件名带内容哈希，所以 --size-only 是安全的（同尺寸即同内容），
      # 也能避免本地/CI 每次构建刷新 mtime 导致的全量重传。
      - name: 同步 assets（可删）/ Sync assets
        run: |
          set -euo pipefail
          aws s3 sync dist/assets/ "s3://${SITE_BUCKET}/assets/" \
            --region "${AWS_REGION}" \
            --delete \
            --size-only \
            --cache-control "public, max-age=31536000, immutable"

      # 第二段：入口页单独覆盖为不缓存。
      # 不用 --exclude 把入口页排除在第一段之外——AWS CLI 的 --exclude 会
      # 连带影响 --delete 的判定，入口页会被当成「源站已不存在」而删掉。
      - name: 覆盖入口页 / Upload index.html
        run: |
          set -euo pipefail
          aws s3 cp dist/index.html "s3://${SITE_BUCKET}/index.html" \
            --region "${AWS_REGION}" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --metadata-directive REPLACE

      # data/version.json 由处理函数在加照片时失效；前端发布只改了入口页，
      # 失效它一个路径就够，不必连带打 /。
      - name: 失效 CDN / Invalidate
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/index.html"

      - name: 摘要 / Summary
        run: |
          {
            echo "### 前端已发布 / Web deployed"
            echo ""
            echo "- 站点 / site: https://${{ vars.SITE_DOMAIN }}"
            echo "- 桶前缀 / prefixes: \`assets/\`（可删）、\`index.html\`"
            echo "- 未触碰 / untouched: \`photos/\`、\`data/\`"
            echo "- 提交 / commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
